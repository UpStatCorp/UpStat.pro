

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    # Поднимаем лимит коннектов: web (4×60) + worker (replicas×60) >> дефолтных 100.
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-saas_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saas_user} -d ${POSTGRES_DB:-saas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FastAPI backend
  backend:
    build: .
    environment: &app_env
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-saas_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saas}
      - REDIS_URL=redis://redis:6379
      # Очередь анализов (arq)
      - USE_QUEUE=${USE_QUEUE:-true}
      - WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-8}
      - WORKER_JOB_TIMEOUT=${WORKER_JOB_TIMEOUT:-1800}
      - WORKER_MAX_TRIES=${WORKER_MAX_TRIES:-3}
      - PER_USER_CONCURRENCY=${PER_USER_CONCURRENCY:-2}
      - CHECKLIST_CONCURRENCY=${CHECKLIST_CONCURRENCY:-4}
      - SECRET_KEY=${SECRET_KEY}
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY}
      # SMTP
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-UpStat}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # OpenAI / Azure Voice
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_VOICE_LIVE_ENDPOINT=${AZURE_VOICE_LIVE_ENDPOINT}
      - AZURE_VOICE_LIVE_API_KEY=${AZURE_VOICE_LIVE_API_KEY}
      - AZURE_VOICE_LIVE_MODEL=${AZURE_VOICE_LIVE_MODEL:-gpt-4o-realtime-preview}
      # Voice Live GA-версия (API вышел из превью в ноябре 2025).
      - AZURE_VOICE_LIVE_API_VERSION=${AZURE_VOICE_LIVE_API_VERSION:-2026-07-15}
      # Голос тренера. Дефолты здесь ДОЛЖНЫ совпадать с voice_assistant/config.py:
      # значение из compose всегда перекрывает дефолт в коде, поэтому устаревшее
      # значение тут молча отменяет правку в конфиге.
      - AZURE_VOICE_LIVE_VOICE=${AZURE_VOICE_LIVE_VOICE:-ru-RU-DmitryNeural}
      # Голоса переключателя «мужской/женский» в настройках тренировки.
      - AZURE_VOICE_LIVE_VOICE_MALE=${AZURE_VOICE_LIVE_VOICE_MALE:-ru-RU-DmitryNeural}
      - AZURE_VOICE_LIVE_VOICE_FEMALE=${AZURE_VOICE_LIVE_VOICE_FEMALE:-ru-RU-SvetlanaNeural}
      # Запасной GA-голос: на него сессия переключается сама, если основной
      # (preview) не синтезирует. Без проброса переменной фолбэк не настраивается.
      - AZURE_VOICE_LIVE_VOICE_FALLBACK=${AZURE_VOICE_LIVE_VOICE_FALLBACK:-ru-RU-DmitryNeural}
      # Тон речи — подбирается без пересборки образа.
      - AZURE_VOICE_LIVE_VOICE_TEMPERATURE=${AZURE_VOICE_LIVE_VOICE_TEMPERATURE:-0.15}
      - AZURE_VOICE_LIVE_VOICE_RATE=${AZURE_VOICE_LIVE_VOICE_RATE:-1.0}
      - AZURE_VOICE_LIVE_VOICE_STYLE=${AZURE_VOICE_LIVE_VOICE_STYLE:-}
      - AZURE_VOICE_LIVE_TRANSCRIPTION_MODEL=${AZURE_VOICE_LIVE_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      - AZURE_VOICE_LIVE_TRANSCRIPTION_LANGUAGE=${AZURE_VOICE_LIVE_TRANSCRIPTION_LANGUAGE:-ru}
      - USE_AZURE_VOICE_LIVE=${USE_AZURE_VOICE_LIVE:-true}
      # ElevenLabs (опционально)
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - ELEVENLABS_STABILITY=${ELEVENLABS_STABILITY:-0.75}
      - ELEVENLABS_SIMILARITY_BOOST=${ELEVENLABS_SIMILARITY_BOOST:-0.8}
      - ELEVENLABS_STYLE=${ELEVENLABS_STYLE:-0.0}
      - ELEVENLABS_USE_SPEAKER_BOOST=${ELEVENLABS_USE_SPEAKER_BOOST:-true}
      # Google OAuth (опционально)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      # CRM (опционально)
      - AMOCRM_CLIENT_ID=${AMOCRM_CLIENT_ID}
      - AMOCRM_CLIENT_SECRET=${AMOCRM_CLIENT_SECRET}
      - AMOCRM_REDIRECT_URI=${AMOCRM_REDIRECT_URI}
      - BITRIX24_CLIENT_ID=${BITRIX24_CLIENT_ID}
      - BITRIX24_CLIENT_SECRET=${BITRIX24_CLIENT_SECRET}
      - BITRIX24_REDIRECT_URI=${BITRIX24_REDIRECT_URI}
      # Прочее
      - GPT_MODEL=${GPT_MODEL:-gpt-4o-mini}
      - STT_PROVIDER=${STT_PROVIDER:-whisper_openai}
      - TTS_PROVIDER=${TTS_PROVIDER:-elevenlabs}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - TRAIN_PUBLIC_URL=${TRAIN_PUBLIC_URL}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-28800}
    volumes:
      - uploads_data:/app/uploads
      - ./app/templates:/app/app/templates:ro
      - ./app/static:/app/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # arq worker — выполняет тяжёлые анализы из очереди (Redis)
  worker:
    build: .
    command: ["arq", "worker.WorkerSettings"]
    environment: *app_env
    volumes:
      # ОБЯЗАТЕЛЬНО тот же том, что у backend: воркер пишет отчёты, web их отдаёт
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas-network
    restart: unless-stopped
    # Масштаб: docker compose up --scale worker=N (или deploy.replicas в swarm)
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      # webroot для ACME http-01 — сюда certbot кладёт токен при продлении
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saas-network
    restart: unless-stopped

networks:
  saas-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  uploads_data:
