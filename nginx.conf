events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    # Docker-DNS резолвер. backend резолвится ДИНАМИЧЕСКИ на каждый запрос
    # (через переменную $backend в proxy_pass ниже). Иначе nginx кешировал бы IP
    # backend один раз при старте, и после пересоздания контейнера backend (новый
    # IP) все запросы ловили бы 502 "connect() failed", пока nginx не перезапустят.
    # ip_hash убран намеренно: один upstream-server → балансировать не между чем,
    # стабильность WS-коннекта держит сам TCP, а не ip_hash.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Локальная разработка — HTTP без SSL
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location / {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ^~ /voice-assistant/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /voice-training/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Редирект HTTP → HTTPS (прод)
    server {
        listen 80;
        server_name upstat.pro www.upstat.pro up-stat.com www.up-stat.com;

        # ACME http-01: ДО редиректа, иначе Let's Encrypt получает 301 вместо
        # токена и продление молча падает (certbot.timer тикает, серт тухнет).
        # Каталог пишет certbot на хосте: -w ~/fastapi/certbot-webroot,
        # сюда он смонтирован ro. root (не alias): certbot сам создаёт
        # подкаталог .well-known/acme-challenge/ внутри webroot.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name upstat.pro www.upstat.pro up-stat.com www.up-stat.com;

        # Копии из /etc/letsencrypt/live/. Их синхронизирует deploy-хук certbot
        # (scripts/certbot-deploy-hook.sh) сразу после продления и шлёт nginx HUP.
        # Руками копировать не нужно.
        ssl_certificate     /etc/nginx/ssl/upstat.pro/fullchain1.pem;
        ssl_certificate_key /etc/nginx/ssl/upstat.pro/privkey1.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ──────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Прокси для всех HTTP-запросов ────────────────────────
        location / {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── WebSocket: голосовой ассистент (старый роутер) ───────
        location ^~ /voice-assistant/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── WebSocket: голосовые тренировки ──────────────────────
        location ^~ /voice-training/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
