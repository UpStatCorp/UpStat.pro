name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff==0.4.4 bandit==1.7.8 detect-secrets==1.5.0

      - name: Ruff — check for errors and import issues
        run: ruff check app/ voice_assistant/ --select E,F,W,I --ignore E501,E402 --no-fix

      - name: Bandit — security scan (high/medium severity)
        run: >
          bandit -r app/ voice_assistant/
          --exclude app/__pycache__,voice_assistant/__pycache__,voice_assistant/temp
          -ll -q

      - name: Detect secrets — scan for leaked credentials
        run: |
          detect-secrets scan \
            --exclude-files '\.secrets\.baseline|\.env\.example|backup\.sql|init\.sql|alembic/versions' \
            app/ voice_assistant/ alembic/ \
          | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          results = data.get('results', {})
          if results:
              print('Potential secrets found:')
              for f, hits in results.items():
                  for h in hits:
                      print(f'  {f}:{h[\"line_number\"]} ({h[\"type\"]})')
              sys.exit(1)
          print('No secrets detected.')
          "

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # Dummy values — tests use mocks, no real services needed
      OPENAI_API_KEY: "sk-test-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars-long"
      USE_AZURE_VOICE_LIVE: "true"
      POSTGRES_USER: "ci"
      POSTGRES_PASSWORD: "ci"
      POSTGRES_DB: "ci_test"
      DATABASE_URL: "sqlite:///./ci_test.db"
      REDIS_URL: "redis://localhost:6379/0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.2.0 pytest-asyncio==0.23.6 pytest-mock==3.14.0

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -p no:warnings

  migrations:
    name: Migrations — clean DB + empty autogenerate
    runs-on: ubuntu-latest
    # Существующий job `test` гоняется на DATABASE_URL=sqlite, хотя
    # app/database.py:9-10 sqlite явно запрещает — то есть ни один тест
    # не импортирует database.py, и проверить миграции там нечем.
    # Здесь нужен настоящий PostgreSQL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_migrations
      SECRET_KEY: "ci-secret-key-for-migrations-at-least-32-chars"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Критерий приёмки: чистая база -> upgrade head -> autogenerate пуст,
      # плюс обратимость downgrade base -> upgrade head.
      - name: Verify migrations
        run: bash tools/verify_migrations.sh

      # Baseline 001 генерируется из app/models.py. Если модели изменили,
      # а baseline не перегенерировали, состав колонок разъедется — ловим здесь.
      - name: Baseline generator is in sync with models
        run: |
          python tools/gen_baseline.py --verify
