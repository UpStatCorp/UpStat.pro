<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ title or "UpStat" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css?v=19">
  <link rel="stylesheet" href="/static/css/notifications.css?v=1">
  <link rel="stylesheet" href="/static/css/progress-tracker.css?v=1">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="/static/js/notifications.js?v=1" defer></script>
  <script src="/static/js/progress-tracker.js?v=1" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a href="/chat" class="brand" aria-label="Перейти в чат">UpStat</a>
      <div class="actions">
        <button id="theme-toggle" class="link" type="button" aria-label="Переключить тему"></button>
        <form action="/logout" method="post" aria-label="Форма выхода"><button class="link" aria-label="Выйти из аккаунта">Выйти</button></form>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const storedTheme = localStorage.getItem('theme');
    if (storedTheme === 'dark') document.body.classList.add('dark');
    updateIcon();

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcon();
    });

    function updateIcon(){
      var sun = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
      var moon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      themeToggle.innerHTML = document.body.classList.contains('dark') ? sun : moon;
    }
  </script>
</body>
</html>
